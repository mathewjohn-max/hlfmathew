<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Calculators</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Finance Calculators</h2>
        <button onclick="showCalculator('lowip')">Low-IP Calculator</button>
        <button onclick="showCalculator('ip')">IP Calculator</button>
        <button onclick="showCalculator('emi')">EMI Calculator</button>

        <!-- Low-IP Calculator -->
        <div id="lowip" class="input-field">
            <h3>Low-IP Calculator</h3>
            <label for="exShowroomPrice">Ex Showroom Price:</label>
            <input type="number" id="exShowroomPrice" placeholder="Enter Ex Showroom Price">

            <label for="roadTax">Road Tax:</label>
            <input type="number" id="roadTax" placeholder="Enter Road Tax">

            <label for="insurance">Insurance:</label>
            <input type="number" id="insurance" placeholder="Enter Insurance">

            <label for="loanPercentage">Loan Percentage:</label>
            <input type="number" id="loanPercentage" value="90">

            <label for="processingFeePercentage">Processing Fee Percentage:</label>
            <input type="number" id="processingFeePercentage" value="3">

            <label for="showroomOnroad">Showroom Onroad:</label>
            <input type="number" id="showroomOnroad" placeholder="Enter Showroom Onroad">

            <button onclick="calculateLowIP()">Calculate Low-IP</button>

            <div id="lowipResults" class="results"></div>
        </div>

        <!-- IP Calculator -->
        <div id="ip" class="input-field">
            <h3>IP Calculator</h3>
            <label for="onroadPriceIP">ONROAD PRICE:</label>
            <input type="number" id="onroadPriceIP" placeholder="Enter ONROAD PRICE">

            <label for="ipAmount">IP Amount:</label>
            <input type="number" id="ipAmount" placeholder="Enter IP Amount">

            <button onclick="calculateIP()">Calculate IP</button>

            <div id="ipResults" class="results"></div>
        </div>

        <!-- EMI Calculator -->
        <div id="emi" class="input-field">
            <h3>EMI Calculator</h3>
            <label for="loanAmount">Loan Amount:</label>
            <input type="number" id="loanAmount" placeholder="Enter Loan Amount">

            <label for="years">Select Years:</label>
            <select id="years">
                <option value="2">2 Years</option>
                <option value="3">3 Years</option>
                <option value="4">4 Years</option>
            </select>

            <button onclick="calculateEMI()">Calculate EMI</button>

            <div id="emiResults" class="results"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
